name: CI

# By hand, and on every pull request so an outside contribution is built, tested and scanned before anyone reads it.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test & scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets
        run: bash scripts/check-secrets.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Filum.slnx --configuration Release

      - name: Test
        run: dotnet test Filum.slnx --configuration Release --no-build
